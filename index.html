<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Nam Giới Cao Cấp - Đẳng Cấp & Riêng Tư</title>
    <style>
        :root {
            --bg-color: #1a120b;
            --card-bg: #261910;
            --accent-gold: #c59b27;
            --text-main: #f3efe6;
            --text-sub: #b8a99a;
            --red-sale: #e53935;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(26, 18, 11, 0.9), rgba(26, 18, 11, 0.95)), url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 15px;
            box-sizing: border-box;
            padding-bottom: 80px;
        }
        .security-banner {
            background-color: #000;
            color: var(--accent-gold);
            text-align: center;
            font-size: 11px;
            padding: 6px;
            border-bottom: 1px solid rgba(197, 155, 39, 0.3);
            font-weight: 600;
        }
        .header {
            text-align: center;
            margin: 15px 0;
        }
        .header h1 {
            font-size: 22px;
            margin: 0 0 5px 0;
            color: var(--accent-gold);
            font-weight: 700;
        }
        .header p {
            font-size: 12px;
            color: var(--text-sub);
            margin: 0;
        }
        .search-box {
            width: 100%;
            padding: 12px 15px;
            border-radius: 25px;
            border: 1px solid rgba(197, 155, 39, 0.4);
            background: rgba(38, 25, 16, 0.9);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .search-box::placeholder {
            color: var(--text-sub);
        }
        .filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            background: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid rgba(197, 155, 39, 0.2);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--accent-gold);
            color: #1a120b;
            font-weight: 600;
            border-color: var(--accent-gold);
        }
        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-gold);
            margin-bottom: 12px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .product-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(197, 155, 39, 0.2);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .product-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .product-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--red-sale);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .product-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .product-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .product-price-box {
            margin-bottom: 8px;
        }
        .price-new {
            color: #ffca28;
            font-size: 13px;
            font-weight: bold;
        }
        .price-old {
            color: var(--text-sub);
            font-size: 10px;
            text-decoration: line-through;
            margin-left: 5px;
        }
        .btn-buy {
            background: linear-gradient(135deg, #ffc107, #ffa000);
            color: #1a120b;
            border: none;
            padding: 7px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .floating-cart {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0068ff;
            color: white;
            padding: 12px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 104, 255, 0.4);
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            z-index: 100;
        }
        /* Modal Giỏ Hàng */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--accent-gold);
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 12px;
            box-sizing: border-box;
            color: var(--text-main);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--accent-gold);
        }
        .close-modal {
            cursor: pointer;
            font-size: 18px;
            color: var(--text-sub);
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(197, 155, 39, 0.3);
            background: #1a120b;
            color: white;
            box-sizing: border-box;
            font-size: 13px;
            outline: none;
        }
        .btn-submit {
            background: #ffc107;
            color: #1a120b;
            font-weight: bold;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="security-banner">
        🔒 Bảo mật tuyệt đối thông tin - Đóng gói kín đáo 100%
    </div>

    <div class="container">
        <div class="header">
            <h1>SHOP NAM GIỚI CAO CẤP</h1>
            <p>Sản phẩm chính hãng – Giao hàng siêu tốc</p>
        </div>

        <!-- Ô Tìm Kiếm -->
        <input type="text" id="searchInput" class="search-box" placeholder="Nhập tên sản phẩm cần tìm..." onkeyup="filterProducts()">

        <!-- 6 Danh Mục Lọc Nhanh -->
        <div class="filter-container">
            <button class="filter-btn active" onclick="setCategory('all')">Tất cả</button>
            <button class="filter-btn" onclick="setCategory('cuong-cung')">Cương Cứng Nam</button>
            <button class="filter-btn" onclick="setCategory('popper')">Tinh Dầu Popper</button>
            <button class="filter-btn" onclick="setCategory('bao-cao-su')">Bao Cao Su</button>
            <button class="filter-btn" onclick="setCategory('gel-boi-tron')">Gel Bôi Trơn</button>
            <button class="filter-btn" onclick="setCategory('do-choi')">Đồ Chơi Nam</button>
            <button class="filter-btn" onclick="setCategory('vong-deo')">Vòng Đeo Hỗ Trợ</button>
        </div>

        <div class="section-title">
            <span>Danh Sách Sản Phẩm</span>
            <span id="productCount" style="font-size: 11px; color: var(--text-sub);"></span>
        </div>

        <!-- Khung Hiển Thị Sản Phẩm -->
        <div id="productGrid" class="product-grid">
            <!-- Sản phẩm sẽ được render tự động qua JavaScript -->
        </div>
    </div>

    <!-- Nút Nổi Zalo / Mở Giỏ Hàng -->
    <a href="https://zalo.me/0913553362" target="_blank" class="floating-cart">
        💬 CHAT ZALO NGAY (<span id="cartCount">0</span>)
    </a>

    <!-- Modal Nhập Thông Tin Đặt Hàng -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>XÁC NHẬN ĐẶT HÀNG KÍN ĐÁO</span>
                <span class="close-modal" onclick="closeModal()">&times;</span>
            </div>
            <div id="modalProductInfo" style="font-size: 12px; margin-bottom: 12px; color: var(--text-sub);"></div>
            <form id="orderForm" onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label>Họ và Tên</label>
                    <input type="text" id="cusName" class="form-control" required placeholder="Nhập họ và tên...">
                </div>
                <div class="form-group">
                    <label>Số Điện Thoại (giữ nguyên số 0 đầu)</label>
                    <input type="tel" id="cusPhone" class="form-control" required placeholder="Ví dụ: 0913553362">
                </div>
                <div class="form-group">
                    <label>Địa Chỉ Nhận Hàng (Che tên kín đáo)</label>
                    <textarea id="cusAddress" class="form-control" rows="2" required placeholder="Số nhà, tên đường, phường/xã..."></textarea>
                </div>
                <button type="submit" class="btn-submit">XÁC NHẬN ĐẶT MUA</button>
            </form>
        </div>
    </div>

    <script>
        // Dữ liệu mẫu đủ 6 danh mục không bị sót
        const products = [
            { id: 1, name: "Combo 5 Hộp Thuốc Cương Cứng Adenafil", category: "cuong-cung", price: 350000, oldPrice: 490000, badge: "-28% HOT", img: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=300&q=80" },
            { id: 2, name: "Viên Uống Hỗ Trợ Cương Cứng Cấp Tốc", category: "cuong-cung", price: 250000, oldPrice: 350000, badge: "HOT", img: "https://images.unsplash.com/photo-1471864190281-a93a3070b6de?auto=format&fit=crop&w=300&q=80" },
            { id: 3, name: "Tinh Dầu Popper Rush Gốc Siêu Mạnh", category: "popper", price: 220000, oldPrice: 300000, badge: "BÁN CHẠY", img: "https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?auto=format&fit=crop&w=300&q=80" },
            { id: 4, name: "Tinh Dầu Popper Jungle Juice Êm Dịu", category: "popper", price: 190000, oldPrice: 250000, badge: "-24%", img: "https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=300&q=80" },
            { id: 5, name: "Bao Cao Su Gân Gai Nhiều Bi Tròn", category: "bao-cao-su", price: 199000, oldPrice: 280000, badge: "-29%", img: "https://images.unsplash.com/photo-1555685812-4b943f1cb0eb?auto=format&fit=crop&w=300&q=80" },
            { id: 6, name: "Bao Cao Su Siêu Mỏng Ôm Khít Tự Nhiên", category: "bao-cao-su", price: 150000, oldPrice: 200000, badge: "CHÍNH HÃNG", img: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=300&q=80" },
            { id: 7, name: "Gel Bôi Trơn Nhật Bản Gốc Nước 200ml", category: "gel-boi-tron", price: 199000, oldPrice: 280000, badge: "MUA 1 TẶNG 1", img: "https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=300&q=80" },
            { id: 8, name: "Gel Bôi Trơn Silicone Chuyên Dụng Anal", category: "gel-boi-tron", price: 250000, oldPrice: 350000, badge: "CAO CẤP", img: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=300&q=80" },
            { id: 9, name: "Máy Sục Tự Động Nhiều Chế Độ Thông Minh", category: "do-choi", price: 690000, oldPrice: 960000, badge: "-28%", img: "https://images.unsplash.com/photo-1583912267670-6575cb47231f?auto=format&fit=crop&w=300&q=80" },
            { id: 10, name: "Trứng Rung Mini Điều Khiển Kín Đáo", category: "do-choi", price: 180000, oldPrice: 250000, badge: "HOT", img: "https://images.unsplash.com/photo-1555685812-4b943f1cb0eb?auto=format&fit=crop&w=300&q=80" },
            { id: 11, name: "Vòng Đeo Silicon Đàn Hồi Kéo Dài Thời Gian", category: "vong-deo", price: 130000, oldPrice: 180000, badge: "TIỆN LỢI", img: "https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b?auto=format&fit=crop&w=300&q=80" },
            { id: 12, name: "Vòng Đeo Tay Từ Tính Hỗ Trợ Nam Tính", category: "vong-deo", price: 220000, oldPrice: 300000, badge: "VIP", img: "https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b?auto=format&fit=crop&w=300&q=80" }
        ];

        let currentCategory = 'all';
        let selectedProduct = null;

        function renderProducts(list) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            document.getElementById('productCount').innerText = `(${list.length} sản phẩm)`;
            
            list.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        ${p.badge ? `<div class="product-badge">${p.badge}</div>` : ''}
                        <img src="${p.img}" class="product-img" alt="${p.name}">
                        <div class="product-body">
                            <div class="product-name">${p.name}</div>
                            <div class="product-price-box">
                                <span class="price-new">${p.price.toLocaleString()}đ</span>
                                <span class="price-old">${p.oldPrice.toLocaleString()}đ</span>
                            </div>
                            <button class="btn-buy" onclick="openCheckout(${p.id})">MUA SẢN PHẨM</button>
                        </div>
                    </div>
                `;
            });
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            filterProducts();
        }

        function filterProducts() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => {
                const matchCat = (currentCategory === 'all' || p.category === currentCategory);
                const matchKey = p.name.toLowerCase().includes(keyword);
                return matchCat && matchKey;
            });
            renderProducts(filtered);
        }

        function openCheckout(id) {
            selectedProduct = products.find(p => p.id === id);
            document.getElementById('modalProductInfo').innerText = `Sản phẩm: ${selectedProduct.name} - Giá: ${selectedProduct.price.toLocaleString()}đ`;
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('checkoutModal').style.display = 'none';
        }

        function submitOrder(e) {
            e.preventDefault();
            const name = document.getElementById('cusName').value;
            const phone = document.getElementById('cusPhone').value; // Đã hỗ trợ type="tel" không mất số 0
            const address = document.getElementById('cusAddress').value;

            // Link Google Sheet Web App của anh
            const scriptURL = 'https://script.google.com/macros/s/AKfycbzQ7zP19q53JbQ2VlH0G4b_qWzR08f3uV91b5C8X0eF1vK4A2l9/exec'; // Thay link Apps Script của anh vào đây nếu cần

            const formData = new FormData();
            formData.append('Họ Và Tên', name);
            formData.append('Số ĐT', `'` + phone); // Giữ chặt số 0 đầu
            formData.append('Địa Chỉ', address);
            formData.append('Sản Phẩm Đặt Mua', selectedProduct.name);
            formData.append('Tổng Tiền', selectedProduct.price.toLocaleString() + 'đ');

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    alert('Đặt hàng thành công! Đã gửi thông tin về hệ thống.');
                    closeModal();
                    document.getElementById('orderForm').reset();
                })
                .catch(error => {
                    // Fallback chuyển trực tiếp qua Zalo kèm thông tin nếu lỗi mạng
                    const zaloMsg = encodeURIComponent(`Chào anh, tôi muốn mua: ${selectedProduct.name} - Giá: ${selectedProduct.price.toLocaleString()}đ. Tên: ${name}, SĐT: ${phone}, Địa chỉ: ${address}`);
                    window.location.href = `https://zalo.me/0913553362?text=${zaloMsg}`;
                });
        }

        // Khởi chạy ban đầu
        renderProducts(products);
    </script>
</body>
</html>
